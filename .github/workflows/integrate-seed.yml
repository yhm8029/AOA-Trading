name: Wire seed sizing feature
on:
  push:
    branches: ['work/seed-v04']
    paths: ['scripts/integrate_seed_v04.py', '.github/workflows/integrate-seed.yml']
permissions:
  contents: write
  actions: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply exact integration and compile
        run: |
          python scripts/integrate_seed_v04.py
          python -m compileall -q aoa web scripts tests
          node --check web/app.mjs
          node --check web/seed-ui.mjs
      - name: Commit non-workflow changes on isolated feature branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add aoa/server.py aoa/version.py web/app.mjs web/index.html web/boot.mjs web/study-ui.mjs web/pnl-ui.mjs README.md
          git commit -m 'feat: connect seed history to orders and final BTC plus percent outcomes'
          git push origin HEAD:work/seed-v04
          gh workflow run ci.yml --ref work/seed-v04
