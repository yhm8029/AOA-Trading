name: AOA Viewer CI
on:
  push:
    branches: [main, 'fix/replay-data-review', 'feat/study-v03']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Compile Python and run ALL backend regressions
        run: |
          python -m compileall -q aoa scripts run.py tests
          python -m unittest discover -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JS and ALL pure-function regressions
        run: |
          node --check web/app.mjs
          node --check web/study-ui.mjs
          node --test tests/test_frontend.mjs tests/test_review_frontend.mjs tests/test_study_frontend.mjs
  browser:
    strategy:
      fail-fast: false
      matrix:
        suite: [browser_test, browser_edge_test, browser_study_test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/prepare_vendor.py
      - run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Real browser using synthetic trade fixtures only
        run: python -m tests.${{ matrix.suite }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AOA-v03-${{ matrix.suite }}-evidence
          path: test-results/
          retention-days: 30
  package:
    needs: [unit, browser]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/prepare_vendor.py
      - name: Public market probe (record result separately)
        continue-on-error: true
        run: python -m scripts.verify_public_market
      - run: python scripts/build_package.py
      - uses: actions/upload-artifact@v4
        with:
          name: AOA-Whale-Viewer-v0.3-runtime
          path: |
            dist/AOA-Whale-Viewer.zip
            test-results/*.json
          retention-days: 30
