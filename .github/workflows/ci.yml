name: Test and package AOA Whale Viewer
on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: aoa-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Compile source
        run: python -m compileall -q aoa app.py prepare_assets.py tests scripts
      - name: Synthetic unit and API tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
  browser:
    name: Browser, JS and downloadable package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Pure JavaScript tests
        run: node --test tests/core.test.mjs
      - name: Install browser test dependency (not app dependency)
        run: python -m pip install playwright==1.63.0
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Prepare pinned official chart asset
        run: python prepare_assets.py
      - name: Browser functional tests with synthetic fixture
        run: python tests/browser_smoke.py
      - name: Package local app (no user data)
        run: python scripts/package.py
      - name: Upload verified app and synthetic test evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: AOA-Whale-Viewer-${{ github.run_number }}
          path: |
            dist/AOA-Whale-Viewer.zip
            artifacts/
          if-no-files-found: ignore
          retention-days: 30
