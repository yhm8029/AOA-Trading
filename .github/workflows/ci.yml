name: AOA Viewer CI
on:
  push:
    branches: [main, 'fix/replay-data-review']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Compile Python
        run: python -m compileall -q aoa scripts run.py tests
      - name: Run offline backend tests
        run: python -m unittest discover -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JS syntax and all pure-function regressions
        run: |
          node --check web/app.mjs
          node --test tests/test_frontend.mjs tests/test_review_frontend.mjs
  browser-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare pinned chart library and notices
        run: python scripts/prepare_vendor.py
      - name: Install browser test dependency
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Browser test with clearly synthetic fixtures
        run: python -m tests.browser_test
      - name: Public Binance history probe (no user trade upload)
        continue-on-error: true
        run: python -m scripts.verify_public_market
      - name: Build runtime ZIP without user data
        run: python scripts/build_package.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AOA-Viewer-v0.2-runtime-and-tests
          path: |
            dist/AOA-Whale-Viewer.zip
            test-results/*.png
            test-results/*.json
          if-no-files-found: warn
          retention-days: 30
