name: AOA Viewer CI
on:
  push:
    branches: [main, 'fix/**', 'feat/study-v03']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Compile and run all backend and launcher regressions
        run: |
          python -m compileall -q aoa scripts run.py tests
          python -m unittest discover -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Frontend regression tests
        run: |
          node --check web/app.mjs
          node --check web/boot.mjs
          node --check web/seed-ui.mjs
          node --test tests/test_frontend.mjs tests/test_review_frontend.mjs tests/test_study_frontend.mjs tests/test_pnl_frontend.mjs tests/test_seed_frontend.mjs
  browser:
    strategy:
      fail-fast: false
      matrix:
        suite: [browser_test, browser_edge_test, browser_study_test, browser_launch_test, browser_pnl_test, browser_seed_test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/prepare_vendor.py
      - run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Real Chromium regression with synthetic fixtures only
        run: python -m tests.${{ matrix.suite }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AOA-v040-${{ matrix.suite }}-evidence
          path: test-results/
          retention-days: 30
  package:
    needs: [unit, browser]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/prepare_vendor.py
      - name: Public Binance probe (not a user-data audit)
        continue-on-error: true
        run: python -m scripts.verify_public_market
      - run: |
          python scripts/build_package.py
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Verify extracted ZIP runtime
        run: python scripts/test_packaged_runtime.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AOA-Whale-Viewer-v0.4.0-runtime
          path: |
            dist/AOA-Whale-Viewer.zip
            dist/AOA-Whale-Viewer.zip.sha256
            dist/release-manifest.json
            test-results/
          retention-days: 30
  release:
    needs: [unit, browser, package]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: AOA-Whale-Viewer-v0.4.0-runtime
          path: release-input
      - name: Publish new verified release without replacing old assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          asset="release-input/dist/AOA-Whale-Viewer.zip"
          test -f "$asset"
          python -c "import json,os; m=json.load(open('release-input/dist/release-manifest.json')); assert m['version']=='0.4.0'; assert m['commit']==os.environ['GITHUB_SHA']; assert not m['user_data_included']"
          (cd release-input/dist && sha256sum -c AOA-Whale-Viewer.zip.sha256)
          if gh release view v0.4.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Already published. Preserving existing assets.'
          else
            gh release create v0.4.0 "$asset" "$asset.sha256" release-input/dist/release-manifest.json --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'AOA Whale Viewer v0.4.0 — 시드 비중·손익 기여도' --notes-file docs/RELEASE_v0.4.0.md
          fi
