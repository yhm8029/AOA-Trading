name: Integrate wallet date parser fix
on:
  push:
    branches: [work/wallet-v041]
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply reviewed source edits
        run: |
          python scripts/integrate_wallet_v041.py
          python -m compileall -q aoa scripts tests run.py
          node --check web/app.mjs
          node --check web/seed-ui.mjs
      - name: Commit only non-workflow edits to the feature branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add aoa/seed.py aoa/version.py web/index.html web/boot.mjs web/study-ui.mjs web/app.mjs web/pnl-ui.mjs README.md
          git diff --cached --quiet || git commit -m 'fix: connect date-only wallet references without fabricating timestamps'
          git push origin HEAD:work/wallet-v041
          gh workflow run ci.yml --ref work/wallet-v041
